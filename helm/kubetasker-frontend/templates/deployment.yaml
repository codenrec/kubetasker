# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetasker-frontend
  namespace: kubetasker-system
  labels:
    app.kubernetes.io/name: kubetasker-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubetasker-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubetasker-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: kubetasker-frontend
      containers:
      - name: frontend
        image: frontend:0.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
