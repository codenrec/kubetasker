# Service
apiVersion: v1
kind: Service
metadata:
  name: kubetasker-controller-metrics
  namespace: kubetasker-system
  labels:
    app.kubernetes.io/name: kubetasker-controller
    app.kubernetes.io/component: controller
spec:
  selector:
    app.kubernetes.io/name: kubetasker-controller
    app.kubernetes.io/component: controller
  ports:
  - name: metrics
    port: 8443
    targetPort: metrics
