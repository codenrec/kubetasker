apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubetasker-controller.fullname" . }}-metrics-reader
  labels:
    {{- include "kubetasker-controller.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources:
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]