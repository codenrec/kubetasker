# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetasker-controller
  namespace: kubetasker-system
  labels:
    app.kubernetes.io/name: kubetasker-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubetasker-controller
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubetasker-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kubetasker-controller
      containers:
      - name: manager
        image: controller:0.0.1
        imagePullPolicy: IfNotPresent
        args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        ports:
        - name: metrics
          containerPort: 8443
        - name: http
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
